# m52xq 2026-10-21: by default ModemManager drops the modem before every sleep and probes it again after the resume:
# during the sleep nobody is registered for the QMI call/SMS indications, the modem stays silent and an incoming call
# never wakes the phone. The modem stays on while the system sleeps: keep it (quick suspend/resume).
[Service]
ExecStart=
ExecStart=/usr/sbin/ModemManager --test-quick-suspend-resume
