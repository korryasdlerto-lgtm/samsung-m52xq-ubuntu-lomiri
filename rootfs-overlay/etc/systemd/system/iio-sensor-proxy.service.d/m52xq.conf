# M52XQ: iio-sensor-proxy 3.9 built with SSC (libssc) — the Ubuntu 3.8 has no Qualcomm SSC drivers; sensors of this phone live on the ADSP.
[Unit]
After=hexagonrpcd-adsp-sensorspd.service

[Service]
ExecStart=
ExecStart=/usr/local/libexec/iio-sensor-proxy
# libssc talks to the ADSP over QRTR sockets
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
# the proxy probes the sensors only once at start: wait (max 60 s) until SSC really streams accelerometer data, then start anyway
TimeoutStartSec=120
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 60 ]; do timeout 4 ssccli --sensor accelerometer 2>/dev/null | grep -q measurement && exit 0; i=$((i+1)); sleep 1; done; exit 0'
