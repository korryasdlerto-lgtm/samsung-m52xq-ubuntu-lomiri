# m52xq: the default gps::Provider is the Android GPS HAL (none on a mainline kernel): positions come from gpsd,
# fed by m52xq-gnss-gpsd (ModemManager GNSS); the state directory was missing ("Could not store to configuration file")
[Unit]
Wants=m52xq-gnss-gpsd.service
After=m52xq-gnss-gpsd.service

[Service]
# the per-app check resolves the client's AppArmor profile (Ubuntu Touch), there is no AppArmor here: every client was
# rejected ("Could not resolve PID … to apparmor profile"); the service's own switch grants all local clients
Environment=TRUST_STORE_PERMISSION_MANAGER_IS_RUNNING_UNDER_TESTING=1
Environment=LD_PRELOAD=/usr/local/lib/m52xq/libaa-unconfined.so
ExecStartPre=/bin/mkdir -p /var/lib/lomiri-location-service
# classic: the bridge starts gpsd a few seconds after its own unit is "started"; the gpsd provider of lomiri-location-service opens its
# connection ONCE at start and never again, so when it started first, every read failed for good ("GPSD Error: unknown error" each
# second, apps got no position / a 0,0 marker). Wait here (max 40 s) until gpsd listens on 2947.
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 40 ]; do ss -ltn 2>/dev/null | grep -q ":2947 " && exit 0; i=$((i+1)); sleep 1; done; exit 0'
ExecStart=
ExecStart=/usr/bin/lomiri-location-serviced --bus system --provider gpsd::Provider

[Install]
WantedBy=multi-user.target
