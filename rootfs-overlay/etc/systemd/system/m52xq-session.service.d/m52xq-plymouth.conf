[Unit]
# сессия (greeter) стартует только после запуска Plymouth: иначе quit уходит «в пустоту», а потом Plymouth занимает DRM и Mir падает (exit 1, перезапуск сессии)
After=plymouth-start.service
[Service]
# не сбрасывать/очищать консоль tty1 при старте сессии (иначе на долю секунды вылезают логи поверх заставки)
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
