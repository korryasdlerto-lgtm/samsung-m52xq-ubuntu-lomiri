# classic: Lomiri connects to iio-sensor-proxy (auto-rotation, auto-brightness) once, when it starts; the proxy waits for the first
# accelerometer sample from the ADSP (~45 s after boot), so Lomiri came up 15 s before it and never got the sensors. The wait is
# capped (ExecStartPre of iio-sensor-proxy: 60 s, then it starts anyway), so the session is delayed at most that long, behind the splash.
[Unit]
Wants=iio-sensor-proxy.service
After=iio-sensor-proxy.service
