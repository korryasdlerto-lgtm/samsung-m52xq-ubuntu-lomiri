[Unit]
ConditionKernelCommandLine=
[Service]
# тихая консоль + запуск заставки после появления экрана msm (card1) и ещё 2 с: пачка сообщений ядра/GPU уже выведена и не перебивает заставку
ExecStartPre=-/usr/bin/dmesg -n 1
ExecStartPre=/bin/sh -c 'for i in $(seq 1 100); do [ -e /dev/dri/card1 ] && break; sleep 0.1; done; sleep 2'
ExecStart=
ExecStart=/usr/sbin/plymouthd --mode=boot --pid-file=/run/plymouth/pid --attach-to-session --kernel-command-line="quiet splash"
