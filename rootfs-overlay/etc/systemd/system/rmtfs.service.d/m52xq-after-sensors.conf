# M52XQ: rmtfs -s starts the modem remoteproc. On the в33 first boot the modem
# (firmware load + TZ auth from slow PWM UFS) came up in the very same seconds
# as hexagonrpcd brought up the ADSP sensors PD (both at ~116 s).
# в38: the PD itself must be up before the modem, but waiting for iio-sensor-proxy to finish
# (the SSC accelerometer init takes ~24 s) delayed the modem start (and the calls) by that much.
[Unit]
After=hexagonrpcd-adsp-sensorspd.service
