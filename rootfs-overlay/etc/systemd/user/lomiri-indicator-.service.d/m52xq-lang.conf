[Service]
# m52xq classic в8: the language of the user for the shade indicators (see /usr/local/bin/m52xq-session-lang): they start in
# parallel with Lomiri, before its ExecStartPre, and the user manager LANG of /etc/locale.conf (en_US) won over the generator
ExecStartPre=-/usr/local/bin/m52xq-session-lang
