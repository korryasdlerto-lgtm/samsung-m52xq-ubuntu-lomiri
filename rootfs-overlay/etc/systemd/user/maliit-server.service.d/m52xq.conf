[Service]
# платформа Qt wayland (Wayland+GL, как у обычных приложений); MALIIT_FORCE_DBUS_CONNECTION: иначе maliit не регистрируется в D-Bus как org.maliit.server
# DISPLAY=:0 (нужен Mir, чтобы не брать logind) заставляет Mesa EGL выбирать платформу x11 → зависание; QT_IM_MODULE=maliit у сервера → подключается сам к себе
Environment=MALIIT_FORCE_DBUS_CONNECTION=1
Environment=QT_QPA_PLATFORM=wayland-egl
Environment=EGL_PLATFORM=wayland
UnsetEnvironment=DISPLAY QT_IM_MODULE
ExecStart=
ExecStart=/usr/bin/maliit-server
