# m52xq (classic): overrides /usr/lib/tmpfiles.d/click.conf (the same name wins). It gave /opt/click.ubuntu.com to clickpkg on every
# boot; OpenStore's pkcon stand-in (m52xq) runs "click install --user" as the user, which needs to write there ("Cannot acquire
# permission to write to /opt/click.ubuntu.com").
d /opt/click.ubuntu.com 0755 user user - -
