# m52xq (classic): a clean /home has no ~/.config; something running as root at first boot created it (0700, with pulse/cookie; exact process not found), dconf could not
# write and no user setting was saved (keyboard language came back). Created for the user before any such script starts.
d /home/user/.config 0700 user user - -
d /home/user/.config/pulse 0700 user user - -
