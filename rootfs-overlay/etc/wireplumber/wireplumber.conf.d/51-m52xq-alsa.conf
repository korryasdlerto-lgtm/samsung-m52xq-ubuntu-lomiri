# M52XQ: звуковая карта SM-M526B-WCD938X принимает на динамик S16_LE 48000 (проверено aplay hw:0,0; S24/S32 — тишина или ошибка)
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.allowed-rates = [ 48000 ]
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_input.*" } ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.allowed-rates = [ 48000 ]
      }
    }
  }
]
